# ArtCraft Launcher for Coolify (or any platform whose own reverse proxy handles HTTPS).
#
# Coolify: New resource → your repository → Build Pack "Docker Compose" (this file, the default
# /docker-compose.yml). Set the domain on the "launcher" service; Coolify's Traefik gets the
# certificate and routes it to port 8080. Set ARTCRAFT_ADMIN_PASSWORD in Environment Variables.
#
# For a server without such a proxy, use packaging/docker/docker-compose.yml (with Caddy).
services:
  launcher:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Coolify reads this to route the domain you set to port 8080 of this service.
      - SERVICE_FQDN_LAUNCHER_8080
      - ARTCRAFT_ADMIN_USER=${ARTCRAFT_ADMIN_USER:-admin}
      - ARTCRAFT_ADMIN_PASSWORD=${ARTCRAFT_ADMIN_PASSWORD:?}
      - ARTCRAFT_CHECK_MINUTES=${ARTCRAFT_CHECK_MINUTES:-30}
      - ARTCRAFT_LAUNCHER_GITHUB_TOKEN=${ARTCRAFT_LAUNCHER_GITHUB_TOKEN:-}
    volumes:
      - launcher-data:/data
      # The apps' MCP work folders (emptied of old files on the schedule set in Settings).
      - launcher-work:/work
      # Shared with the build service (cli-builder), for MCP tools built from source.
      - launcher-builds:/builds
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "artcraft-launcher-server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Builds an app's MCP tool from its source code when the launcher asks (Settings shows when:
  # apps whose release isn't compatible with MCP yet, but whose code is). It sees only the shared
  # builds folder. Idle otherwise; a build takes 5-20 minutes, a few GB of disk and of memory.
  # Not needed? Remove this service and the launcher-builds lines.
  cli-builder:
    build:
      context: .
      dockerfile: packaging/builder/Dockerfile
    restart: unless-stopped
    environment:
      # Parallel compile jobs: more is faster and takes more memory (about 1 GB each).
      - ARTCRAFT_BUILD_JOBS=${ARTCRAFT_BUILD_JOBS:-2}
    volumes:
      - launcher-builds:/builds

volumes:
  launcher-data:
  launcher-work:
  launcher-builds:
