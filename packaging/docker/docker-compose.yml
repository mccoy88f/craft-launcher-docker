# ArtCraft Launcher on your own domain: the launcher server plus Caddy for HTTPS.
#
#   cd packaging/docker
#   cp .env.example .env      # then set DOMAIN and ARTCRAFT_ADMIN_PASSWORD
#   docker compose up -d --build
#
# Visitors open https://<DOMAIN>/, the administrator https://<DOMAIN>/admin/. See README.md.
name: artcraft-launcher

services:
  launcher:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: artcraft-launcher-server:local
    restart: unless-stopped
    environment:
      ARTCRAFT_ADMIN_USER: ${ARTCRAFT_ADMIN_USER:-admin}
      ARTCRAFT_ADMIN_PASSWORD: ${ARTCRAFT_ADMIN_PASSWORD:?set ARTCRAFT_ADMIN_PASSWORD in .env}
      ARTCRAFT_CHECK_MINUTES: ${ARTCRAFT_CHECK_MINUTES:-30}
      # Optional: raises GitHub's limit from 60 to 5000 requests an hour (no scopes needed).
      ARTCRAFT_LAUNCHER_GITHUB_TOKEN: ${ARTCRAFT_LAUNCHER_GITHUB_TOKEN:-}
    volumes:
      - launcher-data:/data
      # The apps' MCP work folders (emptied of old files on the schedule set in Settings).
      - launcher-work:/work
      # Shared with the build service (cli-builder), for MCP tools built from source.
      - launcher-builds:/builds
    # Only Caddy talks to it. To use a reverse proxy you already run instead of Caddy, remove the
    # caddy service and publish this port on loopback: ports: ["127.0.0.1:8080:8080"]
    expose:
      - "8080"

  # Builds an app's MCP tool from its source code when the launcher asks (Settings shows when:
  # apps whose release isn't compatible with MCP yet, but whose code is). It sees only the shared
  # builds folder. Idle otherwise; a build takes 5-20 minutes, a few GB of disk and of memory.
  # Not needed? Remove this service and the launcher-builds lines.
  cli-builder:
    build:
      context: ../..
      dockerfile: packaging/builder/Dockerfile
    restart: unless-stopped
    environment:
      # Parallel compile jobs: more is faster and takes more memory (about 1 GB each).
      ARTCRAFT_BUILD_JOBS: ${ARTCRAFT_BUILD_JOBS:-2}
    volumes:
      - launcher-builds:/builds

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - launcher
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  launcher-data:
  launcher-work:
  launcher-builds:
  caddy-data:
  caddy-config:
